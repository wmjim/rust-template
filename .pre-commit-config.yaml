fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      # The hooks below need a crate to inspect. In the template repository the
      # package name holds a cargo-generate placeholder, so they stand aside
      # there and run normally in a project generated from the template.
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt.
        entry: bash -c 'grep -q "^name *= *.{" Cargo.toml && exit 0; cargo fmt -- --check'
        language: rust
        files: \.rs$
        args: []
      - id: cargo-deny
        name: cargo deny check
        description: Check cargo dependencies
        entry: bash -c 'grep -q "^name *= *.{" Cargo.toml && exit 0; cargo deny check'
        language: rust
        files: '(^|/)(Cargo\.lock|Cargo\.toml|deny\.toml|.*\.rs)$'
        args: []
      - id: typos
        name: typos
        description: check typo
        entry: bash -c 'typos'
        language: rust
        files: \.*$
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        description: Check the package for errors.
        entry: bash -c 'grep -q "^name *= *.{" Cargo.toml && exit 0; cargo check --workspace'
        language: rust
        files: \.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources
        entry: bash -c 'grep -q "^name *= *.{" Cargo.toml && exit 0; cargo clippy --all-targets --all-features -- -D warnings'
        language: rust
        files: \.rs$
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        description: unit test for the project
        entry: bash -c 'grep -q "^name *= *.{" Cargo.toml && exit 0; cargo nextest run --all-features --no-tests=pass'
        language: rust
        files: \.rs$
        pass_filenames: false
